<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Sign Up Form</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <div class="image-section">
                <div class="logo-container">
                    <img src="images/odin-lined.png" alt="odin lined logo">
                    <img src="images/odin-text.png" alt="odin text">
                </div>

                <p>Photo by <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Halie West</a> on <a href="https://unsplash.com/">Unsplash</a></p>
            </div>

            <div class="form-section">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.
                <br>Sign up <em>now</em> to get started.</p>

                <p>You <em>know</em> you want to.</p>

                <div class="form-container">
                    <p>Let's do this!</p>

                    <form action='' method='get' id='sign-up-form'>
                        <div class='form-row'>
                            <label for='first-name'>First Name</label>
                            <input id='first-name' name='first-name' type='text'/>
                        </div>

                        <div class='form-row'>
                            <label for='last-name'>Last Name</label>
                            <input id='last-name' name='last-name' type='text'/>
                        </div>

                        <div class='form-row'>
                            <label for='email'>Email</label>
                            <input id='email' name='email' type='email' placeholder='joe@example.com'/>
                        </div>

                        <div class='form-row'>
                            <label for="phone-number">Phone Number</label>
                            <input id="phone-number" name="phone-number" type="tel"/>
                        </div>

                        <div class='form-row'>
                            <label for="password">Password</label>
                            <input id="password" name="pwd" type="password"/>
                        </div>

                        <div class='form-row'>
                            <label for="pwd-confirm">Confirm Password</label>
                            <input id="pwd-confirm" name="pwd-confirm" type="password"/>
                        </div>
                    </form>
                </div>

                <button form="sign-up-form" type="submit">Create Account</button>

                <p>Already have an account? <span>Log in</span></p>
            </div>
        </div>
    </body>
</html>
